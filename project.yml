      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordquest.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: WordQuest/WordQuest.entitlements

  WordQuestActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WordQuestActivity
      - path: WordQuest/Models/Theme.swift
      - path: WordQuest/Shared/TriviaActivityAttributes.swift
    info:
      path: WordQuestActivity/Info.plist
      properties:
        CFBundleDisplayName: WordQuest Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordquest.app.activity
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
