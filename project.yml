name: WordQuest
options:
  bundleIdPrefix: com.mamatiquest.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Apple Developer Program team. Left empty, every `xcodegen generate`
    # reset the team and Xcode went back to "Signing requires a development
    # team" — picking one in the Signing & Capabilities editor doesn't survive
    # regeneration, since this project.yml is the source of truth. If the paid
    # membership was issued a new Team ID (developer.apple.com > Membership
    # details), put it here.
    # A Team ID is not a secret; it ships inside every signed build.
    DEVELOPMENT_TEAM: 84LN324B84
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0

targets:
  WordQuest:
    type: application
    platform: iOS
    sources:
      - path: WordQuest
    dependencies:
      - sdk: GameKit.framework
      - sdk: CoreHaptics.framework
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - target: WordQuestActivity
        embed: true
    info:
      path: WordQuest/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: WordQuest
        # Taken from MARKETING_VERSION / CURRENT_PROJECT_VERSION below; hardcoded
        # values would ship every upload as 1.0 (1), which App Store Connect
        # rejects after the first build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS and Apple's own networking — exempt from export compliance,
        # so uploads skip the encryption questionnaire.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "WordQuest uses your local network to find nearby friends for local multiplayer trivia."
        NSBonjourServices:
          - _wq-trivia._tcp
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        # AdMob app ID for the "WordQuest" iOS app. Ad unit IDs live in AdsManager.swift.
        GADApplicationIdentifier: ca-app-pub-7633404067070211~3422088803
        # Turns off the debug-only "native ad validator" popup over test native ads.
        GADNativeAdValidatorEnabled: false
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mamatiquest.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        # Game Center and the iCloud key-value store (progress sync) need the
        # paid Developer Program. ProgressStore.isCloudSyncEnabled must stay
        # true only while this entitlements file is wired up.
        CODE_SIGN_ENTITLEMENTS: WordQuest/WordQuest.entitlements

  WordQuestActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: WordQuestActivity
      - path: WordQuest/Models/Theme.swift
      - path: WordQuest/Shared/TriviaActivityAttributes.swift
    info:
      path: WordQuestActivity/Info.plist
      properties:
        CFBundleDisplayName: WordQuest Activity
        # Must match the app's version and build or the upload is rejected.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mamatiquest.app.activity
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
