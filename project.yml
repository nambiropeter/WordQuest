name: WordQuest
options:
  bundleIdPrefix: com.wordquest.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  WordQuest:
    type: application
    platform: iOS
    sources:
      - path: WordQuest
    dependencies:
      - sdk: GameKit.framework
      - sdk: CoreHaptics.framework
      - sdk: AppTrackingTransparency.framework
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: WordQuestActivity
        embed: true
    info:
      path: WordQuest/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: WordQuest
        NSLocalNetworkUsageDescription: "WordQuest uses your local network to find nearby friends for local multiplayer trivia."
        NSBluetoothAlwaysUsageDescription: "WordQuest uses Bluetooth to connect with nearby friends for local multiplayer trivia."
        NSBluetoothPeripheralUsageDescription: "WordQuest uses Bluetooth to connect with nearby friends for local multiplayer trivia."
        NSBonjourServices:
          - _wq-trivia._tcp
          - _wq-trivia._udp
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSUserTrackingUsageDescription: "WordQuest would like to tailor suggestions to how you play. This is entirely optional and never required to enjoy the app."
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
